[project]
name = "funcomputer"
version = "0.0.2"
description = "funcomputer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "requests>=2.28",
    "tqdm>=4.60",
    "cryptography>=41.0",
    "pycurl>=7.45",
    "urllib3>=1.26",
    "requests_toolbelt>=0.10",
    "funshell>=1.0",
    "farlog>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funcomputer"]

[dependency-groups]
dev = ["pytest>=7.0"]
