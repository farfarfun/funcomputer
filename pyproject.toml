[project]
name = "funcomputer"
version = "0.0.2"
description = "funcomputer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "funshell>=1.0",
    "farlog>=0.1",
    # funshell 1.0.19 会导入 nltlog，但没有声明该依赖。
    "nltlog>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funcomputer"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.8"]

[tool.ruff]
target-version = "py310"
line-length = 88
