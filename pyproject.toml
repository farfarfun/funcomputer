[project]
name = "funcomputer"
version = "0.0.2"
description = "在 Google Colab 中搭建远程开发环境的脚本：挂载 Google Drive、安装并启动 code-server（浏览器版 VS Code）及常用扩展、配置 SSH 与 natapp 内网穿透"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    # 1.0.23 起 funshell 自己声明了 farlog，不再隐式 import 已冻结的 nltlog。
    "funshell>=1.0.23",
    "farlog>=1.1.7",
    "funget>=1.1.69",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funcomputer"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.8"]

[tool.ruff]
target-version = "py312"
line-length = 88
