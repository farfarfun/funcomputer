[project]
name = "funcomputer"
version = "0.0.2"
description = "funcomputer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    # 1.0.23 起 funshell 自己声明了 farlog，不再隐式 import 已冻结的 nltlog。
    "funshell>=1.0.23",
    "farlog>=1.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funcomputer"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.8"]

[tool.ruff]
target-version = "py310"
line-length = 88
