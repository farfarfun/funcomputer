[project]
name = "funcomputer"
version = "0.0.2"
description = "funcomputer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "requests",
    "tqdm",
    "cryptography",
    "pycurl",
    "urllib3",
    "requests_toolbelt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funcomputer"]

[dependency-groups]
dev = ["pytest>=7.0"]
